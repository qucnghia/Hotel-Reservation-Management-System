<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hotel PMS - Hệ Thống Quản Lý & Đặt Phòng Khách Sạn</title>

    <!-- Google Fonts hỗ trợ Tiếng Việt 100% -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Be Vietnam Pro"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        hotel: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            800: '#1e293b',
                            900: '#0f172a',
                            gold: '#d97706',
                            goldLight: '#fef3c7',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Print Stylesheet cho hóa đơn */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-invoice, #printable-invoice * {
                visibility: visible;
            }
            #printable-invoice {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                padding: 20px;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="h-full text-slate-800 flex overflow-hidden">

    <!-- ==================== SIDEBAR TRÁI ==================== -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 shadow-xl select-none z-20">
        <!-- Logo & Brand -->
        <div class="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center text-slate-950 font-black shadow-lg">
                <i data-lucide="hotel" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight tracking-wide text-amber-400">GRAND IMPERIAL</h1>
                <p class="text-[11px] text-slate-400 font-medium tracking-wider uppercase">Smart Hotel PMS</p>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="flex-1 px-3 py-4 space-y-1.5 overflow-y-auto">
            <button onclick="app.switchTab('matrix')" id="nav-matrix" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all bg-amber-500 text-slate-950 shadow-md">
                <i data-lucide="layout-grid" class="w-4 h-4"></i>
                <span>Sơ đồ phòng Matrix</span>
            </button>
            <button onclick="app.switchTab('booking')" id="nav-booking" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white">
                <i data-lucide="calendar-check-2" class="w-4 h-4"></i>
                <span>Đặt phòng & Lịch</span>
            </button>
            <button onclick="app.switchTab('risk')" id="nav-risk" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white">
                <i data-lucide="shield-alert" class="w-4 h-4"></i>
                <span class="flex-1 text-left">Quản trị Rủi ro</span>
                <span class="text-[10px] bg-rose-500 text-white font-bold px-1.5 py-0.5 rounded-full">Blacklist</span>
            </button>
            <button onclick="app.switchTab('services')" id="nav-services" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white">
                <i data-lucide="utensils" class="w-4 h-4"></i>
                <span>Minibar & Dịch vụ</span>
            </button>
            <button onclick="app.switchTab('analytics')" id="nav-analytics" class="nav-item w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-all text-slate-300 hover:bg-slate-800 hover:text-white">
                <i data-lucide="line-chart" class="w-4 h-4"></i>
                <span>Báo cáo & Thống kê</span>
            </button>
        </nav>

        <!-- Trạng thái ca trực -->
        <div class="p-4 border-t border-slate-800 bg-slate-950/40">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <img class="w-9 h-9 rounded-full ring-2 ring-amber-400" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" alt="Avatar">
                    <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full ring-2 ring-slate-900"></span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-white truncate">Lễ tân: Nguyễn Q. Nghĩa</p>
                    <p class="text-[11px] text-slate-400 truncate">Ca sáng: 07:00 - 15:00</p>
                </div>
                <button onclick="app.resetMockData()" title="Khôi phục dữ liệu mẫu gốc" class="p-1.5 text-slate-400 hover:text-amber-400 rounded-lg hover:bg-slate-800 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- ==================== VÙNG CHÍNH ==================== -->
    <div class="flex-1 flex flex-col h-full overflow-hidden bg-slate-100">
        <!-- Top Header Bar -->
        <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between flex-shrink-0 z-10">
            <!-- Search & Quick Filter -->
            <div class="flex items-center gap-3 w-96">
                <div class="relative w-full">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="global-search" oninput="app.handleSearch(this.value)" placeholder="Tìm nhanh phòng (101), khách, số CCCD..." 
                        class="w-full pl-9 pr-4 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition-all">
                </div>
            </div>

            <!-- Header Quick Stats Pills -->
            <div class="flex items-center gap-2 text-xs font-medium">
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Sẵn sàng: <strong id="stat-available">0</strong></span>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200">
                    <span class="w-2 h-2 rounded-full bg-rose-500"></span>
                    <span>Đang ở: <strong id="stat-occupied">0</strong></span>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span>Chờ dọn: <strong id="stat-cleaning">0</strong></span>
                </div>
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                    <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                    <span>Đã đặt: <strong id="stat-booked">0</strong></span>
                </div>
                <div class="h-5 w-[1px] bg-slate-200 mx-1"></div>
                <button onclick="app.openNewBookingModal()" class="flex items-center gap-1.5 px-3.5 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold rounded-lg shadow-sm transition-all text-xs">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>Tạo Đơn Mới</span>
                </button>
            </div>
        </header>

        <!-- Main Content Area Scrollable -->
        <main class="flex-1 overflow-y-auto p-6" id="main-container">
            <!-- Dynamic Content rendered via JS -->
        </main>
    </div>

    <!-- ==================== CÁC MODAL HỆ THỐNG ==================== -->
    <div id="modal-container"></div>

    <!-- Hóa đơn in ấn ẩn (Print Target) -->
    <div id="printable-invoice" class="hidden"></div>

    <!-- Kịch bản logic JavaScript -->
    <script src="./app.js"></script>
</body>
</html>
